<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111116" />
    <meta name="description" content="Granaê: sua grana, seu jogo, sua evolução. Organização financeira de um jeito mais leve." />
    <meta name="color-scheme" content="dark light" />
    <title>Granaê — Sua grana. Seu jogo. Sua evolução.</title>
    <script>
      /* Aplica o tema salvo antes da primeira pintura: evita mostrar o tema errado
         no carregamento. Sem preferência salva, o padrão é o tema escuro. */
      (function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('granae:theme')
          var mode = stored === 'light' || stored === 'system' ? stored : 'dark'
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          theme = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode
        } catch (error) { /* storage bloqueado: mantém o padrão escuro */ }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#111116' : '#F4F7FC')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
